name: Build and Deploy libm2k - linux

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next_stable
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - next_stable
      - '20[1-9][0-9]_R[1-9]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identify-version:
    runs-on: ubuntu-latest
    outputs:
      ci-version: ${{ steps.set_version.outputs.ci-version }}
      cloudsmith-version: ${{ steps.set_version.outputs.cloudsmith-version }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
    - name: Set app version
      id: set_version
      shell: bash
      run: |
        .github/scripts/identify-version.sh
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs-on: ubuntu-latest
            stage: rel
          - architecture: arm64
            runs-on: ubuntu-24.04-arm
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_64:latest
            stage: rel
          - architecture: armhf
            runs-on: ubuntu-24.04-arm
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_32:latest
            platform: linux/arm/v7
            stage: rel
          - architecture: amd64
            runs-on: ubuntu-latest
            stage: dev
            libiio-artifact: Linux-Ubuntu-24.04.deb
          - architecture: arm64
            runs-on: ubuntu-24.04-arm
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_64:latest
            stage: dev
            libiio-artifact: Debian-13-arm64.deb
          - architecture: armhf
            runs-on: ubuntu-24.04-arm
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_32:latest
            platform: linux/arm/v7
            stage: dev
            libiio-artifact: Debian-13-armhf.deb
    runs-on: ${{ matrix.runs-on }}
    needs: identify-version
    container: ${{ matrix.architecture == 'arm64' && matrix.container || '' }}
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      CONTAINER: ${{ matrix.container }}
      CI_VERSION: ${{ needs.identify-version.outputs.ci-version }}
      CLOUDSMITH_VERSION: ${{ needs.identify-version.outputs.cloudsmith-version }}
      LIBIIO_ARTIFACT: ${{ matrix.libiio-artifact || '' }}
      STAGE: ${{ matrix.stage }}
      PLATFORM: ${{ matrix.platform }}
      CLOUDSMITH_ORG: ${{ secrets.CLOUDSMITH_ORG }}
      CLOUDSMITH_REPO: ${{ secrets.CLOUDSMITH_REPO }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - name: Install deps
        shell: sh
        run: |
          .github/scripts/install-deps-linux.sh
      - name: Build libm2k for wheels - amd64/arm64
        if: matrix.architecture == 'amd64' || matrix.architecture == 'arm64'
        shell: bash
        run: |
          mkdir -p build_wheels && cd build_wheels
          cmake .. \
            -DENABLE_PYTHON=ON \
            -DENABLE_TOOLS=ON \
            -DENABLE_CSHARP=OFF \
            -DENABLE_LOG=ON
          make -j$(nproc)
      - name: Build libm2k for wheels - armhf
        if: matrix.architecture == 'armhf'
        shell: bash
        run: |
          docker exec \
            -w /workspace/libm2k \
            debian13-armhf \
            /bin/bash -c "
              set -e
              mkdir -p build_wheels && cd build_wheels
              cmake .. \
                -DENABLE_PYTHON=ON \
                -DENABLE_TOOLS=ON \
                -DENABLE_CSHARP=OFF \
                -DENABLE_LOG=ON
              make -j\$(nproc)
            "
      # This shared-action compatible only with amd64/arm64 architectures - armhf is managed in the next step
      - name: Create debian package - amd64/arm64
        if: ${{ matrix.architecture == 'amd64' || matrix.architecture == 'arm64' }}
        id: build_deb
        uses: analogdevicesinc/shared-actions/deb-generator-action@main
        with:
          working-directory: .
          ignore-path: |
            packaging
          control-path: ${{ matrix.stage == 'dev' && 'packaging/debian_dev' || 'packaging/debian' }}
          version: ${{ env.CI_VERSION }}
      # Also debian creation for for armhf architecture
      - name: Install and verify application
        shell: sh
        run: |
          .github/scripts/install-app.sh
        env:
          ARTIFACTS_DIR: ${{ steps.build_deb.outputs.artifact-dir || '' }}
      - name: Upload debian artifacts to github
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    #v7
        with:
          name: libm2k-debian-${{ matrix.architecture }}-${{ matrix.stage }}
          path: |
            artifacts/
          if-no-files-found: error
      - name: Build wheels - amd64/arm64
        if: matrix.architecture == 'amd64' || matrix.architecture == 'arm64'
        shell: bash
        run: |
          python3 -m pip install --break-system-packages wheel build virtualenv || \
            python3 -m pip install wheel build virtualenv
          cd build_wheels
          mkdir -p wheelhouse
          COMPILE_BINDINGS=True python3 -m build
          cp dist/*.whl wheelhouse/
      - name: Build wheels - armhf
        if: matrix.architecture == 'armhf'
        shell: bash
        run: |
          docker exec \
            -w /workspace/libm2k \
            debian13-armhf \
            /bin/bash -c "
              set -e
              python3 -m pip install --break-system-packages wheel build virtualenv || \
                python3 -m pip install wheel build virtualenv
              cd build_wheels
              mkdir -p wheelhouse
              COMPILE_BINDINGS=True python3 -m build
              cp dist/*.whl wheelhouse/
            "
          # Copy wheels from container to host
          mkdir -p build_wheels/wheelhouse
          docker cp debian13-armhf:/workspace/libm2k/build_wheels/wheelhouse/. ./build_wheels/wheelhouse/
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    #v7
        with:
          name: libm2k-wheels-${{ matrix.architecture }}-${{ matrix.stage }}
          path: build_wheels/wheelhouse/*.whl
          if-no-files-found: error
      - name: Copy wheels to artifacts for cloudsmith
        if: ${{ env.STAGE == 'dev' }}
        shell: bash
        run: |
          cp build_wheels/wheelhouse/*.whl artifacts/ 2>/dev/null || true
      - name: Setup cloudsmith
        if: ${{ env.STAGE == 'dev' && env.CLOUDSMITH_VERSION != '' }}
        uses: cloudsmith-io/cloudsmith-cli-action@92b1383b22bbd36d804b858f273abcdf4d349f6b    # v3
        with:
          oidc-namespace: ${{ secrets.CLOUDSMITH_ORG }}
          oidc-service-slug: ${{ secrets.CLOUDSMITH_SVC }}
      - name: Push to cloudsmith
        if: ${{ env.STAGE == 'dev' && env.CLOUDSMITH_VERSION != '' }}
        shell: bash
        run: |
          .github/scripts/upload-to-cloudsmith.sh
        env:
          WORKSPACE: ${{ github.workspace }}
