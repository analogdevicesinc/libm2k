name: Build and Deploy libm2k - windows

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next_stable
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - next_stable
      - '20[1-9][0-9]_R[1-9]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2022
            stage: rel
          - runs-on: windows-2022
            stage: dev
            libiio-artifact: Windows-VS-2022-x64
    runs-on: windows-2022
    env:
      BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/staging
      COMPILER: Visual Studio 17 2022
      ARCH: x64
      PLATFORM: win64
      LIBIIO_VERSION: libiio-v0   # cloudsmith artifacts need ~latest suffix
      STAGE: ${{ matrix.stage }}
      LIBIIO_ARTIFACT: ${{ matrix.libiio-artifact }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v6

    - name: Select Python 3.11 for main build
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: pwsh
      run: .github/scripts/install_deps.ps1

    - name: Build libm2k
      shell: pwsh
      run: .github/scripts/make_windows.ps1

    - name: Use Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
    - name: Wheel Python 3.9
      shell: pwsh
      run: |
        $SRC_DIR = Get-Item -Path $env:BUILD_SOURCESDIRECTORY
        $OUTSIDE_BUILD = $SRC_DIR.Parent.FullName
        $BUILD_DIR = Join-Path $OUTSIDE_BUILD "libm2k-$env:PLATFORM"
        $TEMP_BUILD_DIR = Join-Path $SRC_DIR "tmp-build-$env:PLATFORM"
        Set-Location $TEMP_BUILD_DIR
        python.exe -m pip install --user --upgrade pip setuptools wheel twine build virtualenv
        $env:COMPILE_BINDINGS = $true
        python.exe -m build
        Remove-Item Env:COMPILE_BINDINGS
        Copy-Item -Path "dist/libm2k*.whl" -Destination (Join-Path $BUILD_DIR "dist")
        Set-Location $SRC_DIR

    - name: Use Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Wheel Python 3.10
      shell: pwsh
      run: |
        $SRC_DIR = Get-Item -Path $env:BUILD_SOURCESDIRECTORY
        $OUTSIDE_BUILD = $SRC_DIR.Parent.FullName
        $BUILD_DIR = Join-Path $OUTSIDE_BUILD "libm2k-$env:PLATFORM"
        $TEMP_BUILD_DIR = Join-Path $SRC_DIR "tmp-build-$env:PLATFORM"
        Set-Location $TEMP_BUILD_DIR
        python.exe -m pip install --user --upgrade pip setuptools wheel twine build virtualenv
        $env:COMPILE_BINDINGS = $true
        python.exe -m build
        Remove-Item Env:COMPILE_BINDINGS
        Copy-Item -Path "dist/libm2k*.whl" -Destination (Join-Path $BUILD_DIR "dist")
        Set-Location $SRC_DIR

    - name: Use Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Wheel Python 3.11
      shell: pwsh
      run: |
        $SRC_DIR = Get-Item -Path $env:BUILD_SOURCESDIRECTORY
        $OUTSIDE_BUILD = $SRC_DIR.Parent.FullName
        $BUILD_DIR = Join-Path $OUTSIDE_BUILD "libm2k-$env:PLATFORM"
        $TEMP_BUILD_DIR = Join-Path $SRC_DIR "tmp-build-$env:PLATFORM"
        Set-Location $TEMP_BUILD_DIR
        python.exe -m pip install --user --upgrade pip setuptools wheel twine build virtualenv
        $env:COMPILE_BINDINGS = $true
        python.exe -m build
        Remove-Item Env:COMPILE_BINDINGS
        Copy-Item -Path "dist/libm2k*.whl" -Destination (Join-Path $BUILD_DIR "dist")
        Set-Location $SRC_DIR

    - name: Use Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Wheel Python 3.12
      shell: pwsh
      run: |
        $SRC_DIR = Get-Item -Path $env:BUILD_SOURCESDIRECTORY
        $OUTSIDE_BUILD = $SRC_DIR.Parent.FullName
        $BUILD_DIR = Join-Path $OUTSIDE_BUILD "libm2k-$env:PLATFORM"
        $TEMP_BUILD_DIR = Join-Path $SRC_DIR "tmp-build-$env:PLATFORM"
        Set-Location $TEMP_BUILD_DIR
        python.exe -m pip install --user --upgrade pip setuptools wheel twine build virtualenv
        $env:COMPILE_BINDINGS = $true
        python.exe -m build
        Remove-Item Env:COMPILE_BINDINGS
        Copy-Item -Path "dist/libm2k*.whl" -Destination (Join-Path $BUILD_DIR "dist")
        Set-Location $SRC_DIR

    - name: Use Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Wheel Python 3.13
      shell: pwsh
      run: |
        $SRC_DIR = Get-Item -Path $env:BUILD_SOURCESDIRECTORY
        $OUTSIDE_BUILD = $SRC_DIR.Parent.FullName
        $BUILD_DIR = Join-Path $OUTSIDE_BUILD "libm2k-$env:PLATFORM"
        $TEMP_BUILD_DIR = Join-Path $SRC_DIR "tmp-build-$env:PLATFORM"
        Set-Location $TEMP_BUILD_DIR
        python.exe -m pip install --user --upgrade pip setuptools wheel twine build virtualenv
        $env:COMPILE_BINDINGS = $true
        python.exe -m build
        Remove-Item Env:COMPILE_BINDINGS
        Copy-Item -Path "dist/libm2k*.whl" -Destination (Join-Path $BUILD_DIR "dist")
        Set-Location $SRC_DIR

    - name: Use Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Wheel Python 3.14
      shell: pwsh
      run: |
        $SRC_DIR = Get-Item -Path $env:BUILD_SOURCESDIRECTORY
        $OUTSIDE_BUILD = $SRC_DIR.Parent.FullName
        $BUILD_DIR = Join-Path $OUTSIDE_BUILD "libm2k-$env:PLATFORM"
        $TEMP_BUILD_DIR = Join-Path $SRC_DIR "tmp-build-$env:PLATFORM"
        Set-Location $TEMP_BUILD_DIR
        python.exe -m pip install --user --upgrade pip setuptools wheel twine build virtualenv
        $env:COMPILE_BINDINGS = $true
        python.exe -m build
        Remove-Item Env:COMPILE_BINDINGS
        Copy-Item -Path "dist/libm2k*.whl" -Destination (Join-Path $BUILD_DIR "dist")
        Set-Location $SRC_DIR

    - name: Create artifact staging directory
      shell: pwsh
      run: New-Item -Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY -ItemType Directory -Force

    - name: Create libm2k-system-setup installer
      shell: pwsh
      run: .github/scripts/create_installer.ps1

    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: Libm2k-System-Setup-Exe
        path: ${{ github.workspace }}/staging/installer/*.exe
        if-no-files-found: error

    - name: Create ZIPs
      shell: pwsh
      run: .github/scripts/create_zips.ps1

    - name: Upload Windows folder artifact
      uses: actions/upload-artifact@v7
      with:
        name: Windows-VS-2022-x64
        path: ${{ github.workspace }}/staging/libm2k-win64
        if-no-files-found: error
