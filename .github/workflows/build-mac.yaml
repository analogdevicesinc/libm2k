name: Build and Deploy libm2k - mac

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next_stable
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - next_stable
      - '20[1-9][0-9]_R[1-9]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15-large
            arch: x64
            stage: rel
          - runs-on: macos-15-large
            arch: x64
            stage: dev
            libiio-artifact: macOS-15-x64.pkg
          - runs-on: macos-15
            arch: arm64
            stage: rel
          - runs-on: macos-15
            arch: arm64
            stage: dev
            libiio-artifact: macOS-15-arm64.pkg
          - runs-on: macos-26-large
            arch: x64
            stage: rel
          - runs-on: macos-26-large
            arch: x64
            stage: dev
            libiio-artifact: macOS-26-x64.pkg
          - runs-on: macos-26
            arch: arm64
            stage: rel
          - runs-on: macos-26
            arch: arm64
            stage: dev
            libiio-artifact: macOS-26-arm64.pkg
          - runs-on: xcode-27
            arch: arm64
            stage: rel
          - runs-on: xcode-27
            arch: arm64
            stage: dev
            libiio-artifact: macOS-27-arm64.pkg
    runs-on: ${{ matrix.runs-on }}
    env:
      GLOG_VERSION: v0.4.0
      ARCHITECTURE: ${{ matrix.arch }}
      STAGE: ${{ matrix.stage }}
      LIBIIO_VERSION: libiio-v0   # cloudsmith artifacts need ~latest suffix
      LIBIIO_ARTIFACT: ${{ matrix.libiio-artifact }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v6

    - name: Select Python 3.11 for main build
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: .github/scripts/install-deps-mac.sh

    - name: Build libm2k
      run: .github/scripts/make_macOS

    - name: Use Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
    - name: Wheel Python 3.9
      run: |
        python3 -m pip install wheel twine build virtualenv
        cd build
        mkdir -p wheelhouse
        COMPILE_BINDINGS=True python3 -m build
        cp dist/*.whl wheelhouse/

    - name: Use Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Wheel Python 3.10
      run: |
        python3 -m pip install wheel twine build virtualenv
        cd build
        mkdir -p wheelhouse
        COMPILE_BINDINGS=True python3 -m build
        cp dist/*.whl wheelhouse/

    - name: Use Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Wheel Python 3.11
      run: |
        python3 -m pip install wheel twine build virtualenv
        cd build
        mkdir -p wheelhouse
        COMPILE_BINDINGS=True python3 -m build
        cp dist/*.whl wheelhouse/

    - name: Use Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Wheel Python 3.12
      run: |
        python3 -m pip install wheel twine build virtualenv
        cd build
        mkdir -p wheelhouse
        COMPILE_BINDINGS=True python3 -m build
        cp dist/*.whl wheelhouse/

    - name: Use Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Wheel Python 3.13
      run: |
        python3 -m pip install wheel twine build virtualenv
        cd build
        mkdir -p wheelhouse
        COMPILE_BINDINGS=True python3 -m build
        cp dist/*.whl wheelhouse/

    - name: Use Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Wheel Python 3.14
      run: |
        python3 -m pip install wheel twine build virtualenv
        cd build
        mkdir -p wheelhouse
        COMPILE_BINDINGS=True python3 -m build
        cp dist/*.whl wheelhouse/

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v7
      with:
        name: libm2k}-macos-${{matrix.arch}}
        path: |
          build/*.pkg
          build_tar/*.tar.gz
          build/wheelhouse/*.whl
          libiio/build/*.pkg
          libiio/build_tar/*.tar.gz
        if-no-files-found: error

    - name: Upload to testPyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        python3 -m pip install --upgrade twine
        python3 -m twine upload --repository testpypi build/wheelhouse/*.whl
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
